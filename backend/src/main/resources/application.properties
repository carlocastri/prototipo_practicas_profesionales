spring.application.name=practicas-profesionales
server.port=8080

# Entorno de prueba: base de datos H2 en memoria (se recrea en cada arranque)
spring.datasource.url=jdbc:h2:mem:practicas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
