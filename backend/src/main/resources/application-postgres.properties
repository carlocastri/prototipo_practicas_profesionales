# Perfil para PostgreSQL (motor definido en el Taller 2).
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/practicas
spring.datasource.username=${DB_USER:practicas}
spring.datasource.password=${DB_PASSWORD:practicas}
spring.jpa.hibernate.ddl-auto=update
